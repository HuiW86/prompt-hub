# Auto-update release pipeline (ADR-017).
#
# Phase 0 prerequisites are satisfied: the minisign keypair, the Apple
# notarization creds, and tauri.conf.json's real `plugins.updater.pubkey` are all
# in place. First live exercise was the v0.1.0 tag on 2026-08-05: signing,
# minisign, provenance and the draft release all worked; notarization silently
# did not (see the credential note on the build step). Nothing was published.
#
# Secret scope (2026-08-05): TAURI_SIGNING_PRIVATE_KEY is an Environment secret
# on `release-signing`, so only a job that declares that environment — and thus
# passes the reviewer gate — can reference it. TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# is still a repository secret; harmless on its own (useless without the key),
# but move it for symmetry.
#
# Security model (ADR-017 §5.5):
#   - Trigger is tag-push ONLY. workflow_dispatch / repository_dispatch /
#     schedule are deliberately NOT listed, so they cannot trigger a release
#     (closes the gate-bypass surface).
#   - `permissions` is minimized to contents:write.
#   - Third-party actions are pinned to commit SHA (not tags).
#   - build and sign are SEPARATE jobs: the `build` job never sees the minisign
#     key, so a poisoned build-time dependency cannot exfiltrate it. The `sign`
#     job runs in a protected Environment (required reviewer) and signs only the
#     already-built, notarized artifacts.
#   - The release is created as a DRAFT; a human verifies hashes, then publishes.
#     A draft is NOT served as `releases/latest`, so the updater never sees an
#     unverified build.

name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── Job 1: build + notarize. No minisign key in scope. ──────────────────────
  build:
    strategy:
      fail-fast: true
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify version triple matches the tag
        run: bash scripts/check-version.sh "${GITHUB_REF_NAME#v}"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          targets: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Build + notarize the .app AND the .dmg. createUpdaterArtifacts is
      # disabled here so the bundler does not try to minisign (no key in this
      # job) — the .app.tar.gz updater package is signed later in the sign job,
      # matching the ADR §6 order: notarize .app → package → tauri signer sign.
      #
      # The .dmg is a direct-install download only (NOT an updater artifact): it
      # never enters latest.json and is never minisigned, so producing it here
      # is safe. Tauri bundles `app` before `dmg` and the dmg reuses the
      # already-signed+notarized .app (tauri-bundler bundle ordering), so the
      # .app inside the dmg is the same notarized bundle; the dmg itself is
      # signed + notarized + stapled by the same Apple creds.
      # Credential contract (tauri.app/distribute/sign/macos, verified 2026-08-05):
      # the App Store Connect method reads exactly APPLE_API_ISSUER +
      # APPLE_API_KEY (the *Key ID string*) + APPLE_API_KEY_PATH (a path to the
      # .p8). There is no APPLE_API_KEY_ID variable — v0.1.0's first tag passed
      # that name and put the .p8 body in APPLE_API_KEY, so Tauri could not
      # assemble a credential set, silently SKIPPED notarization, and still went
      # green. Hence the secret→variable mapping below is deliberately crossed:
      # our APPLE_API_KEY_ID secret holds the Key ID, our APPLE_API_KEY secret
      # holds the .p8 body.
      - name: Build + notarize
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The secret may hold the .p8 verbatim or base64-wrapped. Normalize,
          # then let openssl decide: an unparseable key fails here rather than
          # degrading into another silent skip.
          printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$APPLE_API_KEY_PATH"; then
            base64 -d < "$APPLE_API_KEY_PATH" > "$APPLE_API_KEY_PATH.pem"
            mv "$APPLE_API_KEY_PATH.pem" "$APPLE_API_KEY_PATH"
          fi
          openssl pkey -in "$APPLE_API_KEY_PATH" -noout
          test -n "$APPLE_API_KEY" && test -n "$APPLE_API_ISSUER"

          pnpm tauri build \
            --target ${{ matrix.target }} \
            --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # The gate that was missing. Notarization failing OPEN is the whole reason
      # an unnotarized v0.1.0 reached draft: the step above is named for an
      # outcome nothing verified. Assert the outcome on the artifact itself —
      # a stapled ticket and a Gatekeeper accept — so a skipped or failed
      # notarization can never again produce a green build.
      - name: Assert notarized + stapled
        run: |
          set -euo pipefail
          app="src-tauri/target/${{ matrix.target }}/release/bundle/macos/prompt-hub.app"
          dmg="$(ls src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          spctl -a -vvv -t exec "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - name: Pack notarized .app for handoff
        run: |
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/macos"
          tar -C "$dir" -czf "app-${{ matrix.target }}.tgz" prompt-hub.app

      # Rename the dmg to the full-triple convention used by the updater
      # artifacts (prompt-hub_<version>_<target>.dmg) instead of Tauri's own
      # arch token (aarch64 / x64), so Release assets read consistently. Exactly
      # one dmg is produced per matrix target.
      - name: Stage dmg for handoff
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          src="$(ls "$dir"/*.dmg)"
          cp "$src" "prompt-hub_${version}_${{ matrix.target }}.dmg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.target }}
          path: |
            app-${{ matrix.target }}.tgz
            prompt-hub_*_${{ matrix.target }}.dmg
          retention-days: 1
          if-no-files-found: error

  # ── Job 2: sign + assemble latest.json + draft release. Gated. ──────────────
  sign:
    needs: build
    runs-on: macos-latest
    # Required-reviewer gate: the protected Environment `release-signing` holds
    # the minisign key, so it is injected only after manual approval.
    #
    # ADR-017 §5.5 wants a reviewer who is NOT the tag author; this repository
    # has exactly one collaborator, so approval is necessarily self-approval and
    # the gate stops being a second pair of eyes. That is the solo-maintainer
    # fallback the same section anticipates, and it is NOT free: the compensating
    # control is mandatory local verification of the built artifacts before
    # publishing the draft. See docs/release-runbook.md.
    environment: release-signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Package each notarized .app into its updater .app.tar.gz, then minisign
      # it. tauri signer reads the key from env. ::add-mask:: + no `set -x` keep
      # the key out of the (public) Actions log.
      - name: Sign + assemble latest.json
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY"
          echo "::add-mask::$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
          version="${GITHUB_REF_NAME#v}"
          repo="${GITHUB_REPOSITORY}"
          base="https://github.com/${repo}/releases/download/${GITHUB_REF_NAME}"
          mkdir -p dist
          platforms_json="{}"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            case "$target" in
              aarch64-apple-darwin) platkey=darwin-aarch64 ;;
              x86_64-apple-darwin) platkey=darwin-x86_64 ;;
            esac
            # Direct-install dmg: already signed+notarized in the build job. It
            # is NOT minisigned and NOT added to latest.json — just staged into
            # dist for the draft-release asset list.
            cp "artifacts/app-${target}/prompt-hub_${version}_${target}.dmg" dist/
            tar -xzf "artifacts/app-${target}/app-${target}.tgz" -C artifacts
            archive="dist/prompt-hub_${version}_${target}.app.tar.gz"
            tar -C artifacts -czf "$archive" prompt-hub.app
            rm -rf artifacts/prompt-hub.app
            pnpm tauri signer sign "$archive"
            sig="$(cat "${archive}.sig")"
            url="${base}/$(basename "$archive")"
            platforms_json="$(jq -n \
              --argjson p "$platforms_json" \
              --arg k "$platkey" \
              --arg sig "$sig" --arg url "$url" \
              '$p + {($k): {signature: $sig, url: $url}}')"
          done
          jq -n \
            --arg version "$version" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$platforms_json" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' \
            > dist/latest.json

      # Provenance: assert tag ↔ latest.json ↔ every artifact agree on version,
      # and that each latest.json URL points at a file present in dist. Fail the
      # release rather than rely on a human spotting a malformed manifest.
      - name: Assert provenance
        run: bash scripts/assert-provenance.sh "${GITHUB_REF_NAME#v}" dist

      # DRAFT release: a draft is never served as `releases/latest`, so the
      # updater cannot pick it up until a human verifies hashes and publishes.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes live in the repo so they get reviewed like anything
          # else. Missing notes must not fail the build — the draft still needs
          # a human pass before publishing, and the placeholder says so.
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --notes "Draft — no ${notes} in the repo. Write the notes, then verify artifacts and publish."
          fi
          # Assets: updater package (.app.tar.gz) + its minisig + latest.json
          # manifest, plus the direct-install .dmg (not in latest.json — new
          # users install from the dmg, the updater consumes .app.tar.gz).
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            "$@" \
            dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig dist/latest.json
